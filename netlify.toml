# ─────────────────────────────────────────────────────────────────────
# Despliegue del frontend en Netlify.
#
# El proxy de abajo apunta al API desplegado en Render. Si cambias el
# nombre del servicio en render.yaml, hay que actualizar esa URL aca.
# ─────────────────────────────────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  # Relativo a `base`, no a la raiz del repo: esto apunta a frontend/dist.
  publish = "dist"

[build.environment]
  # Vite 8 pide "^20.19.0 || >=22.12.0". Fijamos 22 y no 20 porque la rama
  # 20 ya salio de soporte y "20" a secas puede resolver a una version
  # anterior a la 20.19, con la que el build falla.
  NODE_VERSION = "22"

# Netlify hace de proxy hacia el API. Asi el navegador ve un unico origen
# y no hay preflight CORS: el frontend sigue pidiendo a /api tal cual, sin
# saber que el backend vive en otro dominio.
#
# Va ANTES del fallback del SPA: las reglas se evaluan en orden y el
# comodin /* se tragaria tambien las rutas del API.
[[redirects]]
  from   = "/api/*"
  to     = "https://nutrisoftware-api.onrender.com/api/:splat"
  status = 200
  force  = true

# Fallback del SPA: react-router resuelve las rutas en el cliente, asi que
# cualquier URL profunda (/pacientes/123) tiene que devolver el index.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
